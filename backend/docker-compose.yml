services:
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]   # só o Caddy alcança; a internet, não
    restart: unless-stopped
    depends_on: [redis]

  worker:
    build: .
    env_file: .env
    command: rq worker protocolos --url redis://redis:6379/0
    restart: unless-stopped
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ["redis_data:/data"]

  # Frontend OPCIONAL no servidor: por padrão o site roda na Vercel (grátis,
  # CDN global) e o VPS cuida só da API + robôs — economiza ~1 GB de RAM.
  # Para subir o site também aqui: docker compose --profile site up -d --build
  frontend:
    profiles: ["site"]
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.fscadvocaciadigital.com.br}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://midywtybplbdqmkxfoyj.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_AGENDA_URL: ${NEXT_PUBLIC_AGENDA_URL:-}
    ports: ["127.0.0.1:3000:3000"]   # idem
    restart: unless-stopped

volumes:
  redis_data:
