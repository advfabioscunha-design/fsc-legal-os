<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  A fonte do padrão do escritório é a Calibri Light, que é da Microsoft
  e não se instala em servidor Linux. A Carlito é a equivalente livre,
  com as MESMAS MEDIDAS: mesma largura de letra, mesma quebra de linha,
  mesmo número de páginas.

  Isso importa porque o advogado confere o documento no Word, onde a
  Calibri existe, e o cliente recebe o PDF gerado aqui. Sem este mapa, o
  LibreOffice troca por uma fonte serifada qualquer, e os dois deixam de
  ser a mesma página: a paginação muda, a assinatura anda de folha e o
  que foi aprovado não é o que foi enviado.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Calibri Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
</fontconfig>
